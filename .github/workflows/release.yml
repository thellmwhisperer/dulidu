name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Version tag
        required: true
        type: string

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: make release TAG="$RELEASE_TAG"
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ github.token }}
